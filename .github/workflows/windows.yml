name: windows

# Manual Windows check of a branch: format, lint, layers and tests (with ffmpeg, so the
# real video, subtitle and DVD tests run). Start it from the Actions tab or with
# `gh workflow run windows.yml --ref <branch>`. For an installer to try by hand, run the
# release workflow on the branch instead (`gh workflow run release.yml --ref <branch>`):
# it builds the Windows installer by default (`-f platforms=all|linux|macos` for others)
# and publishes only from a tag.
on:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going, so only the latest commit
# uses Windows minutes.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: much less to write and link (PDBs on Windows).
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-test
          # Save the build even when a test fails, so the next run is not a cold build.
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The same pinned, SHA-256-verified build the app downloads for Windows users
      # (read from Pin::WINDOWS, so a pin bump is tested automatically).
      - name: Install the app's pinned ffmpeg (real video, subtitle and DVD tests need it)
        shell: bash
        run: |
          pin=crates/engine/src/ffmpeg_install.rs
          url=$(grep -m1 'url: "' "$pin" | sed -E 's/.*"([^"]+)".*/\1/')
          sha=$(grep -m1 'sha256: "' "$pin" | sed -E 's/.*"([^"]+)".*/\1/')
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.zip" "$url"
          echo "$sha  $RUNNER_TEMP/ffmpeg.zip" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/ffmpeg.zip" > /dev/null
          bin=$(dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe | head -1)")
          cygpath -w "$bin" >> "$GITHUB_PATH"
      - name: Tool versions
        shell: bash
        run: |
          rustc --version
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (Windows-only code paths included)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Layers and branding
        run: |
          cargo xtask layers
          cargo xtask brand-check
      # One workspace build serves both test steps. Selecting a single package
      # (`-p fm-ui`) resolves features differently and rebuilt ~350 crates.
      - name: Tests (UI included, without pixel snapshots)
        run: cargo nextest run --workspace --locked --no-fail-fast -E "not binary_id(fm-ui::snapshots)"
      # Baselines are rendered on Linux; a different GPU/font rasterizer may differ by a
      # few pixels, so this step reports without failing the run.
      - name: UI pixel snapshots (informational)
        continue-on-error: true
        run: cargo test --workspace --locked --test snapshots
      - name: Upload snapshot diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs-windows
          path: crates/ui/tests/snapshots/*.diff.png
          if-no-files-found: ignore

