name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Installers to build (a tag push always builds all three)"
        type: choice
        options: [windows, linux, macos, all]
        default: windows

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Manual test builds pick their platforms (Windows by default) to save runner minutes;
  # a tag push builds all three.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          all='[
            {"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","formats":"deb,appimage"},
            {"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","formats":"nsis"},
            {"name":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin","formats":"dmg"}
          ]'
          if [ "$PLATFORMS" = all ] || [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            picked=$(jq -c . <<<"$all")
          else
            picked=$(jq -c --arg p "$PLATFORMS" '[.[] | select(.name | startswith($p))]' <<<"$all")
          fi
          if [ "$(jq length <<<"$picked")" -eq 0 ]; then
            echo "No platform matches '$PLATFORMS'" >&2
            exit 1
          fi
          echo "matrix=$picked" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match Cargo.toml version $v" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils pkg-config libasound2-dev
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build
        run: cargo build --release --locked -p fm-app --target ${{ matrix.target }}
      - name: Stage binary where the packager expects it
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/filemanagerultra* target/release/ || true
          rm -f target/release/*.d target/release/*.pdb
      # macOS: Developer ID signing and notarization. cargo-packager imports the certificate
      # into a temporary keychain, signs the app with the hardened runtime, notarizes and
      # staples it, then signs the DMG. The App Store Connect API key is only on disk for
      # this job (the runner is discarded afterwards; the cleanup step removes it anyway).
      - name: macOS signing credentials
        if: runner.os == 'macOS'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "No signing secrets: building an unsigned DMG" >&2
            exit 0
          fi
          umask 077
          printf %s "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.DEVID_CERT_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.DEVID_CERT_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.ASC_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.ASC_ISSUER_ID || '' }}
        run: |
          cargo xtask packager-config
          cargo packager --config target/Packager.toml --release --formats ${{ matrix.formats }}
      - name: Notarize, staple and verify the DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg=$(ls target/packager/*.dmg)
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<<"$result")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id <<<"$result")" "${auth[@]}" || true
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app=$(ls -d "$mnt"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'Identifier=|flags=.*runtime|TeamIdentifier='
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach "$mnt"
      - name: Remove the signing key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: filemanagerultra-${{ matrix.name }}
          path: |
            target/packager/*.deb
            target/packager/*.AppImage
            target/packager/*-setup.exe
            target/packager/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build release notes from the tag description
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force
          v="${TAG#v}"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            # GitHub heading anchor of "## [X.Y.Z] - date": brackets and dots dropped
            anchor="$(grep -m1 -F "## [$v]" CHANGELOG.md | sed -e 's/^## //' -e 's/[^A-Za-z0-9 -]//g' -e 's/ /-/g' | tr 'A-Z' 'a-z')"
            echo "[Full changelog](https://github.com/$REPO/blob/$TAG/CHANGELOG.md#$anchor)"
          } > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
