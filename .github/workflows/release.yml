name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, formats: "deb,appimage" }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, formats: "nsis" }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, formats: "dmg" }
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match Cargo.toml version $v" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils pkg-config libasound2-dev
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build
        run: cargo build --release --locked -p fm-app --target ${{ matrix.target }}
      - name: Stage binary where the packager expects it
        shell: bash
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/filemanagerultra* target/release/ || true
          rm -f target/release/*.d target/release/*.pdb
      - name: Bundle ffmpeg and ffprobe (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ffmpeg.zip
          cp ffmpeg-master-latest-win64-lgpl/bin/ffmpeg.exe ffmpeg-master-latest-win64-lgpl/bin/ffprobe.exe target/release/
          cp ffmpeg-master-latest-win64-lgpl/LICENSE.txt target/release/ffmpeg-LICENSE.txt
      - name: Package
        run: |
          cargo xtask packager-config
          cargo packager --config target/Packager.toml --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v7
        with:
          name: filemanagerultra-${{ matrix.name }}
          path: |
            target/packager/*.deb
            target/packager/*.AppImage
            target/packager/*-setup.exe
            target/packager/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build release notes from the tag description
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --tags --force
          v="${TAG#v}"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            # GitHub heading anchor of "## [X.Y.Z] - date": brackets and dots dropped
            anchor="$(grep -m1 -F "## [$v]" CHANGELOG.md | sed -e 's/^## //' -e 's/[^A-Za-z0-9 -]//g' -e 's/ /-/g' | tr 'A-Z' 'a-z')"
            echo "[Full changelog](https://github.com/$REPO/blob/$TAG/CHANGELOG.md#$anchor)"
          } > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
