  <text x="44" y="61" class="title">FileManagerUltra / icon directions</text>
  <text x="44" y="91" class="sub">Five original concepts. One identity, platform-sensitive finishes. Current app icon stays unchanged.</text>
  <text x="428" y="143" class="column">Windows</text>
  <text x="716" y="143" class="column">macOS</text>
  <text x="1004" y="143" class="column">Linux</text>
  <text x="428" y="165" class="note" text-anchor="middle">Free silhouette / soft depth</text>
  <text x="716" y="165" class="note" text-anchor="middle">Rounded tile / inset symbol</text>
  <text x="1004" y="165" class="note" text-anchor="middle">Free silhouette / flat colour</text>

