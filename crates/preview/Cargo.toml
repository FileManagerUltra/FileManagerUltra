[package]
name = "fm-preview"
description = "Content sniffing and decoding of files into a plain preview model (no UI, no egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
fm-vfs.workspace = true
fm-media.workspace = true
regex.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
toml = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng.workspace = true
quick-xml.workspace = true
flate2 = { workspace = true, features = ["rust_backend"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
syntect = { workspace = true, features = ["default-fancy"] }
pulldown-cmark.workspace = true
fast_image_resize.workspace = true
resvg.workspace = true

[dev-dependencies]
tempfile.workspace = true
fm-testkit.workspace = true
