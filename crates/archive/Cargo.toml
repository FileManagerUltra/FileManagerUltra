[package]
name = "fm-archive"
description = "Archive formats as read-only or staged-writable file systems over a random-access source (no UI, no egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
fm-vfs.workspace = true
sha2.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
zip = { workspace = true, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "ppmd", "aes-crypto", "time"] }
tar.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
bzip2.workspace = true
lzma-rust2.workspace = true
ruzstd.workspace = true
sevenz-rust2.workspace = true

[dev-dependencies]
fm-testkit.workspace = true
tempfile.workspace = true
