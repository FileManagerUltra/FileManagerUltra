[package]
name = "fm-app"
description = "The desktop application shell (eframe/glow)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "filemanagerultra"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fm-brand.workspace = true
fm-dragout.workspace = true
fm-winout.workspace = true
fm-engine.workspace = true
fm-layout.workspace = true
fm-ui.workspace = true
serde_json.workspace = true
fm-vfs.workspace = true
eframe.workspace = true
egui.workspace = true
# Feature-only dependency: enables winit's Wayland title bar (see root Cargo.toml).
winit.workspace = true
souvlaki.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
# Windows draws with wgpu (Direct3D 12): NVIDIA's OpenGL driver leaked per frame (change
# `windows-wgpu`). OpenGL stays available as a preference and fallback.
eframe = { workspace = true, features = ["wgpu"] }

[target.'cfg(target_os = "linux")'.dependencies]
fm-wayland.workspace = true

[dev-dependencies]
fm-testkit.workspace = true

[target.'cfg(windows)'.build-dependencies]
fm-brand.workspace = true
winresource.workspace = true
