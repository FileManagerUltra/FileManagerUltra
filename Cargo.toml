[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/filemanagerultra/filemanagerultra"
rust-version = "1.95"

[workspace.dependencies]
# internal (path dependencies, added per crate)
fm-brand = { path = "crates/brand" }
fm-vfs = { path = "crates/vfs" }
fm-fs-local = { path = "crates/fs-local" }
fm-fs-smb = { path = "crates/fs-smb" }
fm-fs-sftp = { path = "crates/fs-sftp" }
fm-discovery = { path = "crates/discovery" }
fm-git = { path = "crates/git" }
fm-testkit = { path = "crates/testkit" }
fm-dragout = { path = "crates/dragout" }
fm-wayland = { path = "crates/wayland" }
fm-winout = { path = "crates/winout" }
fm-winsec = { path = "crates/winsec" }
fm-ops = { path = "crates/ops" }
fm-sync = { path = "crates/sync" }
fm-layout = { path = "crates/layout" }
fm-term = { path = "crates/term" }
fm-preview = { path = "crates/preview" }
fm-pdf = { path = "crates/pdf" }
fm-media = { path = "crates/media" }
fm-engine = { path = "crates/engine" }
fm-ui = { path = "crates/ui" }

# external — UI: eframe with the glow renderer; Windows adds wgpu in fm-app (change windows-wgpu)
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "clipboard",
    "links",
    "system_fonts",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["datepicker"] }
jiff = "0.2"
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
# eframe/egui-winit both build winit with `default-features = false`, which drops
# `wayland-csd-adwaita`. Without it Wayland windows get winit's fallback CSD frame,
# whose `set_title` is a no-op (smithay-client-toolkit's fallback frame) — the title
# bar renders blank even though the title is set. The adwaita frame renders it
# (embedded Cantarell) and follows the desktop light/dark preference.
winit = { version = "0.30", features = ["wayland-csd-adwaita"] }

# external — core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
memchr = "2.8"
toml = "1.1"
directories = "5"
log = "0.4"
sysinfo = "0.40"
trash = "5"
opener = { version = "0.9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# fm-git only: pure-Rust git (no network, no hooks, no external programs)
gix = { version = "0.90", default-features = false, features = ["sha1", "status", "revision", "index", "blob-diff", "excludes", "attributes"] }
similar = "3"
portable-pty = "0.9"
vt100 = "0.18"

# external — media (fm-media only; cpal needs ALSA headers on Linux)
cpal = "0.18"
symphonia = { version = "0.6.1", features = ["aac", "alac", "mp3", "isomp4"] }
rubato = { version = "0.16", default-features = false }
rtrb = "0.3"

# external — OS media controls (fm-app only)
# System media controls (MPRIS, SMTC, Now Playing; add-media-pane design 17). zbus keeps
# Linux free of libdbus.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
# Native window handles: Windows SMTC (fm-app) and Wayland drag and drop (fm-wayland);
# same major as eframe uses.
raw-window-handle = "0.6"

# external — previews (fm-preview; fm-engine uses image, flate2 and plist too).
# Members add the features they need.
image = { version = "0.25", default-features = false }
flate2 = { version = "1", default-features = false }
serde_yaml_ng = "0.10"
quick-xml = "0.42"
syntect = { version = "5", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
fast_image_resize = "6"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
# Mermaid diagrams in Markdown (change markdown-mermaid): pure Rust, only behind fm_preview::mermaid.
merman = { version = "=0.10.0", default-features = false, features = ["svg", "native-fonts", "layout-elk", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-state", "diagram-er", "diagram-gantt", "diagram-pie", "diagram-journey", "diagram-timeline", "diagram-git-graph", "diagram-mindmap"] }
merman-export = { version = "=0.10.0", default-features = false, features = ["native-fonts"] }
plist = "1"
# PDF (fm-pdf only; add-pdf-preview D1): hayro renders, lopdf writes incremental updates.
hayro = { version = "=0.9.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
lopdf = { version = "=0.47.0", default-features = false }
zeroize = { version = "1.8", default-features = false }
# PDF signing and verification (fm-pdf only; add-pdf-preview D9/D13): RustCrypto, pure
# Rust, aligned with the versions russh already brings in.
der = { version = "0.8", default-features = false, features = ["alloc", "derive", "oid", "std"] }
spki = { version = "0.8", default-features = false, features = ["alloc", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
cms = { version = "=0.3.0-rc.2", default-features = false, features = ["std"] }
pkcs12 = { version = "=0.2.0-rc.0", default-features = false, features = ["kdf"] }
pkcs5 = { version = "0.8", default-features = false, features = ["pbes2", "3des", "alloc"] }
pkcs8 = { version = "0.11", default-features = false, features = ["alloc", "std"] }
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "encoding"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
signature = { version = "3", default-features = false, features = ["alloc", "rand_core"] }
sha1 = { version = "0.11", default-features = false, features = ["oid"] }
hmac = "0.13"
des = "0.9"
rc2 = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
# Signature font outlines for typed visual signatures (already in the tree via resvg).
ttf-parser = { version = "0.25", default-features = false, features = ["std", "glyph-names", "variable-fonts"] }

# external — platform drag and drop (fm-dragout, fm-wayland, fm-winout) and Windows
# executable resources (fm-app build script)
x11rb = { version = "0.14", default-features = false }
wayland-client = "0.31"
wayland-backend = { version = "0.3", default-features = false }
rustix = "1"
windows-core = "0.62"
windows = "0.62"
winresource = "0.1"

# external — SFTP (fm-fs-sftp only; tokio never leaks to other crates)
russh = "0.65"
russh-sftp = "3"
# Already in the tree through russh; only fm-fs-sftp tests name it.
bytes = "1.12"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
secrecy = "0.10"

# external — SMB (fm-fs-smb only; pure Rust, sync mode, NTLM)
smb = { version = "=0.12.1", default-features = false, features = ["sign", "encrypt", "multi_threaded"] }
# external — LAN discovery (fm-discovery only; pure Rust mDNS, no async runtime)
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"
socket2 = "0.6"

# external — xtask tooling
regex = "1"

# external — dev only
proptest = "1"
tempfile = "3"
sha2 = "0.11"
# external — sync checksums (fm-sync only; pure Rust build, no C/asm)
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
# Hostile input must not panic (golden rules 1 and 8): `get()` instead of `[i]`/`[a..b]`,
# and no byte-range slicing of `str` that can split a UTF-8 character.
indexing_slicing = "deny"
string_slice = "deny"
redundant_clone = "warn"

[profile.dev]
debug = 1

# Image/text decoding is unusably slow unoptimised; keep dev builds usable on large files.
[profile.dev.package."*"]
opt-level = 3
# No debug info for third-party crates: it made target/debug grow past 100 GB. Our own
# crates keep line tables (debug = 1 above); remove this line to step into dependencies.
debug = false

# Decoding/resizing is generic and inlined into this crate, so it needs optimising too.
[profile.dev.package.fm-preview]
opt-level = 3

# Real-time audio DSP (time stretch, equalizer) must keep up in dev builds too.
[profile.dev.package.fm-media]
opt-level = 3

[patch.crates-io]
sspi = { path = "vendor/sspi" }
smb-transport = { path = "vendor/smb-transport" }
vt100 = { path = "vendor/vt100" }
egui-winit = { path = "vendor/egui-winit" }
russh-sftp = { path = "vendor/russh-sftp" }

# Fat LTO with one codegen unit: faster and smaller. Panics are caught on purpose
# (see engine), so no panic=abort. opt-level stays 3 because decode speed matters most.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
