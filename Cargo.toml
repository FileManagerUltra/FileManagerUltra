[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/filemanagerultra/filemanagerultra"
homepage = "https://github.com/filemanagerultra/filemanagerultra"
rust-version = "1.95"

[workspace.dependencies]
# internal (path dependencies, added per crate)
fm-brand = { path = "crates/brand" }
fm-vfs = { path = "crates/vfs" }
fm-fs-local = { path = "crates/fs-local" }
fm-fs-smb = { path = "crates/fs-smb" }
fm-fs-sftp = { path = "crates/fs-sftp" }
fm-discovery = { path = "crates/discovery" }
fm-git = { path = "crates/git" }
fm-testkit = { path = "crates/testkit" }
fm-ops = { path = "crates/ops" }
fm-layout = { path = "crates/layout" }
fm-term = { path = "crates/term" }
fm-preview = { path = "crates/preview" }
fm-engine = { path = "crates/engine" }
fm-ui = { path = "crates/ui" }

# external — UI: eframe with the glow renderer (design D6: no wgpu in a file manager)
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "clipboard",
    "links",
    "system_fonts",
] }
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["datepicker"] }
jiff = "0.2"
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
# eframe/egui-winit both build winit with `default-features = false`, which drops
# `wayland-csd-adwaita`. Without it Wayland windows get winit's fallback CSD frame,
# whose `set_title` is a no-op (smithay-client-toolkit's fallback frame) — the title
# bar renders blank even though the title is set. The adwaita frame renders it
# (embedded Cantarell) and follows the desktop light/dark preference.
winit = { version = "0.30", features = ["wayland-csd-adwaita"] }

# external — core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
toml = "0.8"
directories = "5"
log = "0.4"
sysinfo = "0.39"
trash = "5"
opener = { version = "0.9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# fm-git only: pure-Rust git (no network, no hooks, no external programs)
gix = { version = "0.90", default-features = false, features = ["sha1", "status", "revision", "index", "blob-diff", "excludes", "attributes"] }
similar = "3"
portable-pty = "0.9"
vt100 = "0.18"

# external — SFTP (fm-fs-sftp only; tokio never leaks to other crates)
russh = "0.64"
russh-sftp = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
secrecy = "0.10"

# external — SMB (fm-fs-smb only; pure Rust, sync mode, NTLM)
smb = { version = "=0.12.1", default-features = false, features = ["sign", "encrypt", "multi_threaded"] }
# external — LAN discovery (fm-discovery only; pure Rust mDNS, no async runtime)
mdns-sd = { version = "0.21", default-features = false }
if-addrs = "0.15"
socket2 = "0.6"

# external — xtask tooling
regex = "1"

# external — dev only
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"

[profile.dev]
debug = 1

# Image/text decoding is unusably slow unoptimised; keep dev builds usable on large files.
[profile.dev.package."*"]
opt-level = 3

# Decoding/resizing is generic and inlined into this crate, so it needs optimising too.
[profile.dev.package.fm-preview]
opt-level = 3

[patch.crates-io]
sspi = { path = "vendor/sspi" }
smb-transport = { path = "vendor/smb-transport" }
vt100 = { path = "vendor/vt100" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
